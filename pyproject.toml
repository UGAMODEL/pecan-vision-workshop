[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pecan-vision-workshop"
version = "0.1.0"
description = "Sample code, base models, and configuration guidance for deploying deep-learning computer vision algorithms in a pecan post-processing context."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "UGA Manufacturing Living Labs and the MODEL Group" }
]
license = { text = "MIT" }
keywords = ["computer-vision", "pecan", "workshop", "deep-learning"]

[tool.setuptools]
packages = ["pecan_vision_workshop"]
